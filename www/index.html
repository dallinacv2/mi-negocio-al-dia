<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Negocio Al Día</title>
<meta name="theme-color" content="#0E5A6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra superior con nombre y caja del día; navegación por pestañas (abajo en teléfono); contenido en una columna ancha con tarjetas solo donde hay registros. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#16212B; --muted:#5B6B7A; --line:#D8DEE5;
  --accent:#0E5A6B; --accent-ink:#FFFFFF; --accent-soft:#DCEBEE;
  --ok:#1E7A4F; --ok-soft:#DDF0E6; --warn:#9A5A08; --warn-soft:#F8EBD3; --bad:#B3261E; --bad-soft:#F8DEDB;
  --f-display:'Familjen Grotesk','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F161C; --surface:#17212A; --ink:#E7EDF2; --muted:#93A3B2; --line:#283541;
  --accent:#4FB3C8; --accent-ink:#06222A; --accent-soft:#16323A;
  --ok:#4CC38A; --ok-soft:#153126; --warn:#E3A04A; --warn-soft:#3A2A12; --bad:#F0877F; --bad-soft:#3B1A18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#17212A; --ink:#E7EDF2; --muted:#93A3B2; --line:#283541;
  --accent:#4FB3C8; --accent-ink:#06222A; --accent-soft:#16323A;
  --ok:#4CC38A; --ok-soft:#153126; --warn:#E3A04A; --warn-soft:#3A2A12; --bad:#F0877F; --bad-soft:#3B1A18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);margin:0}
.app-shell{display:grid;grid-template-columns:260px 1fr;min-height:100dvh}
.sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100dvh}
.sidebar-header{background:linear-gradient(135deg,#0E5A6B 0%,#0B4A57 100%);color:#fff;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand{font:700 20px var(--f-display);letter-spacing:-.02em;color:#fff}
.brand-sub{font-size:12px;opacity:.9;margin-top:2px}
.sidebar-nav{display:flex;flex-direction:column;gap:4px;padding:12px 10px;overflow:auto}
.sidebar-nav button{display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;border-radius:12px;padding:14px 15px;font-size:16px;font-weight:500;color:var(--ink);cursor:pointer}
.sidebar-nav button:hover{background:var(--accent-soft)}
.sidebar-nav button[aria-selected="true"]{background:linear-gradient(90deg,rgba(14,90,107,.12) 0%,transparent 100%);color:var(--accent);font-weight:600}
.sidebar-nav .nav-ico{width:22px;height:22px;font-size:19px;display:inline-flex;align-items:center;justify-content:center}
.sidebar-nav .badge{margin-left:auto}
.main-area{display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 2px rgba(15,22,28,.02)}
.topbar-left{display:flex;flex-direction:column;gap:2px}
.topbar-title{font:700 18px var(--f-display)}
.topbar-sub{font-size:13px;color:var(--muted)}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)} .dot.off{background:var(--warn)}
.content{padding:22px;max-width:1180px;width:100%;margin:0 auto}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* compat legacy nav hidden in new layout */
.nav{display:none}

/* tarjetas resumen */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:18px}
.sum-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px -18px rgba(14,90,107,.9);padding:16px;display:flex;align-items:center;gap:12px}
.sum-card .sum-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.sum-card.ventas .sum-ico{background:rgba(30,122,79,.12);color:var(--ok)}
.sum-card.cobros .sum-ico{background:rgba(154,90,8,.12);color:var(--warn)}
.sum-card.prestamos .sum-ico{background:rgba(14,90,107,.12);color:var(--accent)}
.sum-card.gastos .sum-ico{background:rgba(179,38,30,.12);color:var(--bad)}
.sum-card .sum-info{display:flex;flex-direction:column;gap:2px}
.sum-card .sum-label{font-size:13px;color:var(--muted)}
.sum-card .sum-value{font:700 22px var(--f-num)}
.sum-card .sum-sub{font-size:12px;color:var(--muted)}

@media (max-width:980px){
  .app-shell{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .2s ease;width:280px}
  body.sidebar-open .sidebar{transform:translateX(0)}
  .sidebar-backdrop{display:none}
  body.sidebar-open .sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:25}
  .content{padding:16px}
}
@media (min-width:981px){
  .sidebar-backdrop,.menu-toggle{display:none}
}

/* bloques */
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;box-shadow:0 10px 30px -18px rgba(14,90,107,.9)}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font:700 22px var(--f-num);margin-top:6px;overflow-wrap:anywhere}
.kpi.bad .v{color:var(--bad)} .kpi.ok .v{color:var(--ok)}
.sec{margin-top:28px}
.sec>h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 40px -24px rgba(14,90,107,.95);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .amt{font:600 15px var(--f-num);text-align:right;white-space:nowrap}
.row.click{cursor:pointer} .row.click:hover{background:linear-gradient(90deg,var(--accent-soft) 0%,transparent 100%)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:600 16px var(--f-display);margin-bottom:4px}
.two{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-top:0;background:linear-gradient(180deg,rgba(14,90,107,.02) 0%,transparent 100%)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 10px 40px -24px rgba(14,90,107,.95)}

/* estados */
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neu{background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent) 0%,#22d3ee 100%)}

/* controles */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;box-shadow:0 1px 1px rgba(15,22,28,.01)}
.btn:hover{border-color:var(--accent)}
a.btn{text-decoration:none;color:inherit;display:inline-block}
.btn.pri{background:linear-gradient(135deg,var(--accent) 0%,#0B6B7A 100%);border-color:transparent;color:var(--accent-ink);box-shadow:0 8px 30px -16px rgba(14,90,107,.9)}
.btn.sm{padding:6px 10px;font-size:13px} .btn.danger{color:var(--bad)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tools input,.tools select{flex:1;min-width:160px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-width:0;box-shadow:inset 0 1px 1px rgba(15,22,28,.01)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 16px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* ventana de captura */
.veil{position:fixed;inset:0;z-index:40;background:rgba(10,16,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:10px 10px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:720px){.veil{align-items:center}.sheet{border-radius:10px;padding:20px}}
.sheet h2{font-size:20px;margin-bottom:12px}
.f{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.f .full{grid-column:1/-1}
.f label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}
.preview{background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:14px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));max-width:calc(100vw - 32px);text-align:center;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:60;font-size:14px}
table{border-collapse:collapse;width:100%} th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);font-size:14px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;border-top:0}
.scroll{overflow-x:auto}
.hbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
@media (max-width:720px){.nav button{padding-inline:2px;font-size:11px}.badge{margin-left:3px;padding:0 4px}}

/* recibos */
.recibo{background:#fff;color:#111;border:1px dashed #9aa5b1;border-radius:8px;padding:18px 16px;font-family:var(--f-body);font-size:14px;max-width:380px;margin:0 auto}
.recibo .rh{text-align:center;border-bottom:1px dashed #9aa5b1;padding-bottom:10px;margin-bottom:10px}
.recibo .rn{font:700 18px var(--f-display);color:#111}
.recibo .rt{font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;margin-top:8px;color:#0E5A6B}
.recibo .rl{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.recibo .rl span:last-child{text-align:right;font-family:var(--f-num);overflow-wrap:anywhere}
.recibo .rsep{border-top:1px dashed #9aa5b1;margin:8px 0}
.recibo .rtot{font-weight:700;font-size:16px}
.recibo .rf{text-align:center;font-size:12px;color:#555;margin-top:12px}
.recibo .firma{margin-top:26px;border-top:1px solid #111;text-align:center;font-size:12px;padding-top:4px}
.recibo .rit{padding:2px 0;display:flex;justify-content:space-between;gap:10px}
/* teléfono y tablet: barra de pestañas abajo, al alcance del pulgar (reemplaza el menú ☰) */
@media (max-width:980px){
  .menu-toggle,.sidebar,.sidebar-backdrop{display:none!important}
  .nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;gap:0;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:0;border-top:1px solid var(--line);box-shadow:0 -4px 16px -10px rgba(10,16,22,.35);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:1 0 52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 1px 7px;font-size:10px;line-height:1.15;border:0;border-top:3px solid transparent;background:none;color:var(--muted);cursor:pointer;white-space:nowrap;position:relative}
  .nav button[aria-selected="true"]{color:var(--accent);font-weight:600;border-top-color:var(--accent)}
  .nav .nav-ico{font-size:20px;line-height:1}
  .nav .badge{position:absolute;top:3px;left:calc(50% + 6px);margin:0}
  .content{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media print{.nav{display:none!important}}
/* bloqueo con PIN */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
#lock[hidden]{display:none}
.lockbox{width:100%;max-width:320px;text-align:center}
.lockbrand{font:700 22px var(--f-display);margin-bottom:6px}
#lock-msg{margin:0 0 14px;color:var(--muted);min-height:22px}
.lockdots{display:flex;gap:12px;justify-content:center;margin-bottom:18px;min-height:16px}
.lockdots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);display:block}
.lockdots i.on{background:var(--accent)}
.lockpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lockpad button{font:600 24px var(--f-num);padding:16px 0;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.lockpad button:active{background:var(--accent-soft)}
.lockforgot{margin-top:18px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
@media print{
  body.rec .wrap,body.rec #toast{display:none!important}
  body.rec,body.rec .veil{background:#fff!important}
  body.rec .veil{position:static;display:block}
  body.rec .sheet{max-width:none;max-height:none;overflow:visible;padding:0;background:#fff;border-radius:0}
  body.rec .noprint{display:none!important}
  body.rec .recibo{border:0;max-width:none}
  body:not(.rec) .nav,body:not(.rec) .noprint,body:not(.rec) .tools,body:not(.rec) #toast,body:not(.rec) .hbtns{display:none!important}
  body:not(.rec){background:#fff;padding:0}
  .nav{display:none!important}
}
</style>
</head>
<body>
<div class="sidebar-backdrop" data-act="sidebar-close"></div>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand" id="brandSide">Mi Negocio Al Día</div>
      <div class="brand-sub">Panel de control</div>
    </div>
    <nav class="sidebar-nav" id="navSide" aria-label="Navegación principal"></nav>
  </aside>
  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn sm menu-toggle" data-act="sidebar-toggle" aria-label="Abrir menú">☰</button>
        <div>
          <div class="topbar-title">Panel principal</div>
          <div class="topbar-sub" id="today"></div>
        </div>
      </div>
      <div class="hbtns">
        <div class="sync"><i class="dot off" id="dot"></i><span id="syncTxt">Guardando en este navegador</span></div>
        <button class="btn sm" data-act="respaldo" aria-label="Respaldo">Respaldo</button>
        <button class="btn sm" data-act="ajustes" aria-label="Ajustes">Ajustes</button>
      </div>
    </header>
    <div class="content">
      <nav class="nav" id="nav" role="tablist" aria-label="Secciones"></nav>
      <main id="view"></main>
    </div>
  </div>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>
<div id="lock" hidden><div class="lockbox"><div class="lockbrand">Mi Negocio Al Día</div><p id="lock-msg">Escribe tu PIN</p><div class="lockdots" id="lock-dots"></div>
  <div class="lockpad"><button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button><button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button><button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button><button type="button" data-k="del" aria-label="Borrar">⌫</button><button type="button" data-k="0">0</button><button type="button" data-k="ok" aria-label="Entrar">✓</button></div>
  <button type="button" class="lockforgot" id="lock-forgot">Olvidé mi PIN</button></div></div>
<script>
/* ===== Núcleo: datos, utilidades y cálculo de préstamos ===== */
const DATA_COLS = ['clientes','prestamos','pagos','productos','ventas','gastos'];
const COLS = [...DATA_COLS, 'tipos', 'ajustes'];
const S = {clientes:[],prestamos:[],pagos:[],productos:[],ventas:[],gastos:[],tipos:[],ajustes:[]};
const UI = {tab:'inicio', q:'', filtro:'todos', vg:'ventas', clienteId:null, desde:'', hasta:''};
const cfg = () => S.ajustes.find(a => a.id === 'cfg') || {id: 'cfg', negocio: '', tel: '', dir: '', pie: 'Gracias por su confianza.', garantia: '', r: {}};
/* Cada tipo de recibo tiene su título y un texto fijo propio (garantía, condiciones del préstamo, etc.) */
const RECS = [['venta', 'Venta', 'Recibo de venta', 'Ej: Garantía de 6 meses por defectos de fábrica. No cubre golpes ni mal uso.'],
  ['prestamo', 'Préstamo entregado', 'Comprobante de préstamo', 'Ej: El cliente se compromete a pagar cada cuota en su fecha. El atraso genera cargo por mora.'],
  ['cuota', 'Pago de cuota', 'Recibo de cuota de préstamo', 'Ej: Este recibo solo es válido con el sello o la firma del prestamista.'],
  ['mora', 'Pago de mora', 'Recibo de mora', 'Ej: Cargo por pago fuera de fecha según lo acordado.'],
  ['abono', 'Abono a venta a crédito', 'Recibo de abono', 'Ej: Abono a cuenta. El saldo pendiente se indica arriba.']];
const recCfg = k => { const d = RECS.find(x => x[0] === k), r = (cfg().r || {})[k] || {}; return {titulo: r.titulo || d[2], texto: r.texto || ''}; };
let DB = null;

const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const money = n => 'RD$ ' + (Math.round((+n || 0) * 100) / 100).toLocaleString('es-DO', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };

/* Fechas como texto AAAA-MM-DD, sin horas, para que los días de atraso sean exactos */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const hoy = () => ymd(new Date());
const diffDias = (a, b) => Math.round((parse(a) - parse(b)) / 86400000);   // a - b
const sumaDias = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const sumaMeses = (s, n) => { const d = parse(s); const dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n);
  const fin = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(dia, fin)); return ymd(d); };
const fmtF = s => s ? parse(s).toLocaleDateString('es-DO', {day: 'numeric', month: 'short', year: 'numeric'}) : '';
const fmtC = s => s ? parse(s).toLocaleDateString('es-DO', {day: 'numeric', month: 'short'}) : '';

/* ----- almacenamiento: base compartida si existe, si no este navegador ----- */
const CAPN = window.Capacitor;
const ES_APP = !!(CAPN && CAPN.isNativePlatform && CAPN.isNativePlatform());
const NATIVO = () => ES_APP && CAPN.Plugins && CAPN.Plugins.Filesystem && CAPN.Plugins.Share;
function blobB64(blob) { return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ko; r.readAsDataURL(blob); }); }
/* En el APK no existen las descargas del navegador: se guarda el archivo y se abre el menú de Android (Drive, WhatsApp, Archivos...) */
async function guardarNativo(blob, nombre) {
  try {
    const r = await CAPN.Plugins.Filesystem.writeFile({path: nombre, data: await blobB64(blob), directory: 'CACHE'});
    await CAPN.Plugins.Share.share({title: nombre, url: r.uri, dialogTitle: 'Guardar o compartir'});
  } catch (e) {
    const m = String((e && e.message) || e || '');
    if (!/cancel/i.test(m)) aviso('No se pudo guardar el archivo: ' + m);
  }
}
const LS = 'mnad-v1';
function lsLoad() { try { const j = JSON.parse(localStorage.getItem(LS) || '{}'); COLS.forEach(c => S[c] = j[c] || []); } catch (e) {} }
async function lsSave() {
  let okls = true;
  try { localStorage.setItem(LS, JSON.stringify(S)); }
  catch (e) { okls = false; aviso('⚠ No se pudo guardar en el teléfono (¿sin espacio?). Haz un respaldo ahora.'); }
  /* Si la base local de IndexedDB está activa, replica este listado ahí (usado por restauraciones que ya dejaron S en memoria) */
  if (DB && DB.local) { try { await DB.replicar(S); } catch (e) {} }
  return okls;
}

/* ----- base local en IndexedDB: misma interfaz que la base compartida (coleccion.doc.set / onSnapshot) para aguantar mucho más que el límite del navegador y dejar el camino listo para la nube ----- */
let LOCAL_PROM = null;
function crearLocalDB() {
  if (LOCAL_PROM) return LOCAL_PROM;
  LOCAL_PROM = (async () => {
    let db = null;
    try {
      if (!window.indexedDB) return null;
      const rq = indexedDB.open('mnad-local-v1', 1);
      rq.onupgradeneeded = () => { const d = rq.result; COLS.forEach(c => { if (!d.objectStoreNames.contains(c)) d.createObjectStore(c); }); };
      db = await new Promise((ok, ko) => { rq.onsuccess = () => ok(rq.result); rq.onerror = () => ko(rq.error); setTimeout(() => ko(new Error('la base local no abrió a tiempo')), 6000); });
    } catch (e) { return null; }
    const oyentes = {};
    const snap = docs => ({ docs: docs.map(o => ({ id: o.id, data: () => o })) });
    const leer = col => new Promise((ok, ko) => {
      try { const r = db.transaction(col).objectStore(col).getAll(); r.onsuccess = () => ok((r.result || []).filter(x => x && x.id)); r.onerror = () => ko(r.error); } catch (e) { ko(e); }
    });
    const emitir = async col => {
      const oys = oyentes[col]; if (!oys || !oys.length) return;
      try { const s = snap(await leer(col)); oys.forEach(cb => { try { cb(s); } catch (e) {} }); }
      catch (e) { oys.forEach(cb => { try { cb(null, { code: 'local' }); } catch (x) {} }); }
    };
    /* Importa una sola vez: si IndexedDB está vacío y este navegador ya tenía datos, los lleva a la base local */
    try {
      const vacias = (await Promise.all(COLS.map(leer))).every(l => !l.length);
      const j = (() => { try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; } })();
      if (vacias && j) await Promise.all(COLS.map(async c => {
        const l = Array.isArray(j[c]) ? j[c].filter(x => x && x.id) : []; if (!l.length) return;
        await new Promise((ok, ko) => { try { const t = db.transaction(c, 'readwrite'); const s = t.objectStore(c); l.forEach(o => s.put(o, o.id)); t.oncomplete = ok; t.onerror = () => ko(t.error); } catch (e) { ko(e); } });
      }));
    } catch (e) {}
    return {
      local: true,
      /* Sobrescribe cada colección con el listado dado (usado al restaurar copias o respaldos completos) */
      async replicar(listado) {
        for (const c of COLS) {
          const l = Array.isArray(listado[c]) ? listado[c].filter(x => x && x.id) : [];
          await new Promise((ok, ko) => { try { const t = db.transaction(c, 'readwrite'); const s = t.objectStore(c); s.clear(); l.forEach(o => s.put(o, o.id)); t.oncomplete = ok; t.onerror = () => ko(t.error); } catch (e) { ko(e); } });
        }
        await Promise.all(COLS.map(c => emitir(c)));
      },
      collection(col) {
        return {
          doc(id) { return {
            set: async o => { await new Promise((ok, ko) => { try { const t = db.transaction(col, 'readwrite'); t.objectStore(col).put(o, id); t.oncomplete = ok; t.onerror = () => ko(t.error); } catch (e) { ko(e); } }); emitir(col); },
            delete: async () => { await new Promise((ok, ko) => { try { const t = db.transaction(col, 'readwrite'); t.objectStore(col).delete(id); t.oncomplete = ok; t.onerror = () => ko(t.error); } catch (e) { ko(e); } }); emitir(col); }
          }; },
          onSnapshot(cb, err) { (oyentes[col] = oyentes[col] || []).push(cb); leer(col).then(docs => cb(snap(docs))).catch(e => { if (err) err({ code: 'local' }); }); }
        };
      }
    };
  })();
  return LOCAL_PROM;
}

/* ----- respaldos: recordatorio, contador de cambios y copias automáticas del teléfono ----- */
const MK = 'mnad-meta', CK = 'mnad-copias';
const meta = () => { try { return JSON.parse(localStorage.getItem(MK) || '{}') || {}; } catch (e) { return {}; } };
const metaSet = o => { try { localStorage.setItem(MK, JSON.stringify({...meta(), ...o})); } catch (e) {} };
const contarCambio = () => metaSet({cambios: (meta().cambios || 0) + 1});
function marcarRespaldo() { metaSet({ult: hoy(), cambios: 0, pospuesto: ''}); pintar(); }
/* Pide respaldo si pasaron 7 días, si nunca se hizo uno, o si hubo muchos cambios (40) desde el último */
function respaldoPendiente() {
  if (!DATA_COLS.some(c => S[c].length)) return null;
  const m = meta(), cambios = m.cambios || 0, dias = m.ult ? diffDias(hoy(), m.ult) : null;
  if (m.pospuesto === hoy()) return null;
  if (dias === null) return 'Todavía no has hecho ningún respaldo de tus datos.';
  if (dias >= 7) return `Hace ${dias} días que no haces un respaldo.`;
  if (cambios >= 40) return `Has hecho ${cambios} cambios desde tu último respaldo.`;
  return null;
}
function bannerRespaldo() {
  const t = respaldoPendiente(); if (!t) return '';
  return `<div style="background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:14px;margin-bottom:14px">
    <b>Haz tu respaldo</b><div class="small muted" style="margin:2px 0 10px">${t} Si pierdes o cambias el teléfono, sin respaldo se pierden tus clientes, préstamos y ventas.</div>
    <button class="btn sm pri" data-act="respaldo">Hacer respaldo ahora</button> <button class="btn sm" data-act="respaldo-luego">Recordarme mañana</button></div>`;
}
const copiasLeer = () => { try { const l = JSON.parse(localStorage.getItem(CK) || '[]'); return Array.isArray(l) ? l : []; } catch (e) { return []; } };
function copiasGuardar(l) {
  while (l.length) { try { localStorage.setItem(CK, JSON.stringify(l)); return true; } catch (e) { const i = l.findIndex(x => x.t === 'dia'); if (i < 0) break; l.splice(i, 1); } }
  return false;
}
/* Una copia al empezar cada día (últimos 7 días): sirve para deshacer errores. No reemplaza el respaldo fuera del teléfono. */
function copiaDelDia() {
  if ((DB && !DB.local) || !DATA_COLS.some(c => S[c].length)) return;
  const f = hoy(), l = copiasLeer(); if (l.some(x => x.t === 'dia' && x.f === f)) return;
  const d = JSON.stringify(S); if (d.length > 1500000) return;
  const dias = l.filter(x => x.t === 'dia'); dias.push({t: 'dia', f, d}); dias.sort((a, b) => a.f < b.f ? -1 : 1);
  copiasGuardar([...l.filter(x => x.t === 'antes'), ...dias.slice(-7)]);
}
function copiaAntes() {
  if (DB && !DB.local) return; const d = JSON.stringify(S); if (d.length > 1500000) return;
  copiasGuardar([...copiasLeer().filter(x => x.t === 'dia'), {t: 'antes', f: hoy(), d}]);
}
function respaldoActualAntesRestaurar() { copiaAntes(); }
function restaurarCopia(i) {
  const c = copiasLeer()[i]; if (!c) return;
  confirmar('¿Volver a esta copia?', `Se reemplazan los datos de ahora por los de la copia (${c.t === 'antes' ? 'de justo antes de la última restauración' : 'del ' + fmtF(c.f)}). Antes se guarda una copia de lo actual por si te arrepientes.`, 'Sí, volver', () => {
    let j; try { j = JSON.parse(c.d); } catch (e) { return aviso('Esa copia está dañada.'); }
    copiaAntes(); COLS.forEach(k => { S[k] = Array.isArray(j[k]) ? j[k] : []; }); lsSave(); cerrar(); pintar(); aviso('Copia restaurada');
  });
}
/* Aviso de confirmación propio (encima de cualquier ventana abierta) */
function confirmar(titulo, detalle, boton, fn) {
  const d = document.createElement('div'); d.className = 'veil'; d.style.zIndex = 150;
  d.innerHTML = `<div class="sheet" role="alertdialog"><h2>${esc(titulo)}</h2><p style="margin:0 0 12px">${esc(detalle)}</p><div class="foot"><button class="btn" data-cf="no">Cancelar</button><button class="btn danger" data-cf="si">${esc(boton)}</button></div></div>`;
  d.addEventListener('click', e => { const b = e.target.closest('[data-cf]'); if (!b && e.target !== d) return; d.remove(); if (b && b.dataset.cf === 'si') fn(); });
  document.body.appendChild(d);
}

async function guardar(col, obj) {
  if (!obj.id) obj.id = uid();
  contarCambio();
  const i = S[col].findIndex(x => x.id === obj.id);
  if (i >= 0) S[col][i] = obj; else S[col].push(obj);
  if (DB) { try { await DB.collection(col).doc(obj.id).set(obj); } catch (e) { aviso('No se pudo guardar. Intenta de nuevo.'); } }
  else lsSave();
  pintar();
  return obj;
}
async function borrar(col, id) {
  contarCambio();
  S[col] = S[col].filter(x => x.id !== id);
  if (DB) { try { await DB.collection(col).doc(id).delete(); } catch (e) { aviso('No se pudo borrar.'); } }
  else lsSave();
  pintar();
}
let tt;
function aviso(t) { const e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(tt); tt = setTimeout(() => e.hidden = true, 2600); }

/* ----- préstamos ----- */
const FREQ = {diario: 1, semanal: 7, quincenal: 15, mensual: 30};
const FREQ_N = {diario: 'diaria', semanal: 'semanal', quincenal: 'quincenal', mensual: 'mensual'};
const FREQ_P = {diario: 'diarias', semanal: 'semanales', quincenal: 'quincenales', mensual: 'mensuales'};

/* Interés: "total" = % fijo sobre el capital por todo el préstamo; "mensual" = % por cada mes de duración */
function interesTotal(p) {
  const meses = p.cuotas * FREQ[p.freq] / 30;
  return p.base === 'mensual' ? p.capital * p.tasa / 100 * meses : p.capital * p.tasa / 100;
}
/* Todo en centavos exactos: la última cuota absorbe la diferencia para que la suma de las cuotas sea igual al total */
const r2 = n => Math.round(n * 100) / 100;
const TOL = 0.05;   /* diferencias menores a 5 centavos no cuentan como deuda */
const totalPrestamo = p => r2(p.capital + interesTotal(p));
const valorCuota = p => r2(totalPrestamo(p) / p.cuotas);
const montoCuota = (p, i) => i < p.cuotas ? valorCuota(p) : r2(totalPrestamo(p) - valorCuota(p) * (p.cuotas - 1));
function fechaCuota(p, i) { return p.freq === 'mensual' ? sumaMeses(p.inicio, i) : sumaDias(p.inicio, i * FREQ[p.freq]); }

/* El dinero cobrado se aplica a la cuota más antigua primero */
/* Mora: cada cuota genera cargo por día de atraso (% de la cuota). Si ya se pagó tarde, el cargo se queda; si sigue pendiente, sigue creciendo.
   La mora se cobra aparte (pagos tipo 'mora') y no se suma al saldo del préstamo. */
function detalle(p, fecha = hoy()) {
  const pg = S.pagos.filter(x => x.tipo === 'prestamo' && x.refId === p.id).sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : (a.creado || 0) - (b.creado || 0));
  const pagado = pg.reduce((a, x) => a + x.monto, 0);
  const vc = valorCuota(p), tasaMora = (p.mora || 0) / 100;
  /* Cada pago se reparte entre las cuotas más antiguas; la parte pagada tarde deja mora según los días que tardó */
  let mora = 0, atrasoMax = 0, vencido = 0, proxima = null;
  const venceDe = i => fechaCuota(p, i), cubierto = new Array(p.cuotas + 1).fill(0);
  pg.forEach(x => { let m = x.monto; for (let i = 1; i <= p.cuotas && m > 0.0001; i++) { const cabe = montoCuota(p, i) - cubierto[i]; if (cabe <= 0.0001) continue; const t = Math.min(cabe, m); cubierto[i] += t; m -= t; mora += t * tasaMora * Math.max(0, diffDias(x.fecha, venceDe(i))); } });
  const cuotas = [];
  for (let i = 1; i <= p.cuotas; i++) {
    const vence = venceDe(i);
    const mc = montoCuota(p, i);
    const abona = Math.min(cubierto[i], mc);
    const faltaRaw = Math.max(0, mc - abona);
    const falta = faltaRaw < TOL ? 0 : r2(faltaRaw);
    const dias = falta > 0 ? Math.max(0, diffDias(fecha, vence)) : 0;
    let estado = 'pendiente';
    if (falta === 0) estado = 'pagada'; else if (dias > 0) estado = 'vencida'; else if (abona > 0) estado = 'parcial';
    if (estado === 'vencida') { vencido += falta; atrasoMax = Math.max(atrasoMax, dias); mora += falta * tasaMora * dias; }
    if (falta > 0 && !proxima) proxima = {n: i, vence, falta, dias};
    cuotas.push({n: i, vence, monto: mc, abona, falta, dias, estado});
  }
  mora = Math.round(mora * 100) / 100;
  const moraCobrada = S.pagos.filter(x => x.tipo === 'mora' && x.refId === p.id).reduce((a, x) => a + x.monto, 0);
  const moraPend = Math.max(0, Math.round((mora - moraCobrada) * 100) / 100);
  const total = totalPrestamo(p);
  const saldoRaw = total - pagado;
  const saldo = saldoRaw < TOL ? 0 : r2(saldoRaw);
  return {cuotas, pagado, saldo, total, interes: interesTotal(p), vc, mora, moraCobrada, moraPend, atrasoMax, vencido, proxima, saldado: saldo === 0};
}
function estadoPrestamo(p) {
  const d = detalle(p);
  if (d.saldado) return {txt: 'Saldado', cls: 'ok'};
  if (d.atrasoMax > 0) return {txt: d.atrasoMax + (d.atrasoMax === 1 ? ' día' : ' días') + ' de atraso', cls: 'bad'};
  if (d.proxima && diffDias(d.proxima.vence, hoy()) <= 3) return {txt: d.proxima.vence === hoy() ? 'Vence hoy' : 'Vence pronto', cls: 'warn'};
  return {txt: 'Al día', cls: 'neu'};
}

/* ----- ventas, clientes y existencias ----- */
const cliente = id => S.clientes.find(c => c.id === id);
const nombreCli = id => (cliente(id) || {nombre: 'Cliente general'}).nombre;
const producto = id => S.productos.find(p => p.id === id);
const ventaPagado = v => v.pagado0 + S.pagos.filter(x => x.tipo === 'venta' && x.refId === v.id).reduce((a, x) => a + x.monto, 0);
const ventaSaldo = v => Math.max(0, Math.round((v.total - ventaPagado(v) - (v.financiado || 0)) * 100) / 100);
function deudaCliente(id) {
  const pr = S.prestamos.filter(p => p.clienteId === id).reduce((a, p) => a + detalle(p).saldo, 0);
  const vt = S.ventas.filter(v => v.clienteId === id).reduce((a, v) => a + ventaSaldo(v), 0);
  return {prestamos: pr, ventas: vt, total: pr + vt};
}
const stockBajo = p => p.stock <= (p.minimo || 0);
/* ===== Pantallas: navegación, Inicio y Cobros ===== */
const TABS = [['inicio','Inicio'],['cobros','Cobros'],['prestamos','Préstamos'],['clientes','Clientes'],['ventas','Ventas'],['inventario','Inventario'],['reportes','Reportes']];

function pintar() {

  if ($('#navSide')) $('#navSide').innerHTML = navHtml;
  $('#today').textContent = new Date().toLocaleDateString('es-DO', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});

const TIPO_PAGO = {prestamo: 'Cuota de préstamo', mora: 'Mora de préstamo', venta: 'Abono a venta a crédito'};
const vacio = (t, s, btn = '') => `<div class="empty"><b>${t}</b>${s}${btn ? `<div style="margin-top:12px">${btn}</div>` : ''}</div>`;
const telWa = t => { let d = String(t || '').replace(/\D/g, ''); if (d.length === 10) d = '1' + d; return d; };
function wa(nombre, tel, texto) {
  const n = telWa(tel);
  return n ? `<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${n}?text=${encodeURIComponent(texto)}">WhatsApp</a>` : '';
}
function msgCobro(c) {
  const cuando = c.dias > 0 ? `con ${c.dias} ${c.dias === 1 ? 'día' : 'días'} de atraso` : `con vencimiento el ${fmtF(c.vence)}`;
  return `Hola ${c.nombre}, te recordamos tu pago de ${money(c.monto)} ${cuando}. Gracias por tu atención.`;
}

/* Todo lo que hay que cobrar: una fila por préstamo con saldo y una por venta a crédito pendiente */
function agendaCobros() {
  const out = [];
  S.prestamos.forEach(p => {
    const d = detalle(p);
    const cli = cliente(p.clienteId) || {};
    if (d.saldado || !d.proxima) {
      if (d.moraPend > 0) out.push({kind: 'prestamo', id: p.id, nombre: cli.nombre || 'Sin cliente', tel: cli.tel, vence: '', dias: 0, monto: d.moraPend, mora: d.moraPend, soloMora: true,
        det: `Préstamo ${FREQ_N[p.freq]} saldado · solo queda la mora`});
      return;
    }
    const monto = d.vencido > 0 ? d.vencido : d.proxima.falta;
    const venc = d.cuotas.filter(c => c.estado === 'vencida').length;
    out.push({kind: 'prestamo', id: p.id, nombre: cli.nombre || 'Sin cliente', tel: cli.tel, vence: d.proxima.vence, dias: d.atrasoMax, monto, mora: d.moraPend,
      det: `Préstamo ${FREQ_N[p.freq]} · cuota ${d.proxima.n} de ${p.cuotas}` + (venc > 1 ? ` · ${venc} cuotas atrasadas` : '')});
  });
  S.ventas.forEach(v => {
    const s = ventaSaldo(v); if (s <= 0) return;
    const cli = cliente(v.clienteId) || {};
    out.push({kind: 'venta', id: v.id, cid: v.clienteId, nombre: cli.nombre || 'Cliente general', tel: cli.tel, vence: v.vence || '', dias: v.vence ? Math.max(0, diffDias(hoy(), v.vence)) : 0, monto: s, mora: 0,
      det: `Venta a crédito del ${fmtC(v.fecha)}`});
  });
  return out.sort((a, b) => (a.vence || '9999') < (b.vence || '9999') ? -1 : 1);
}

function pillCobro(c) {
  if (c.dias > 0) return `<span class="pill bad">${c.dias} ${c.dias === 1 ? 'día' : 'días'} de atraso</span>`;
  if (!c.vence) return `<span class="pill neu">Sin fecha</span>`;
  const f = diffDias(c.vence, hoy());
  return f === 0 ? `<span class="pill warn">Vence hoy</span>` : f <= 3 ? `<span class="pill warn">Vence en ${f} ${f === 1 ? 'día' : 'días'}</span>` : `<span class="pill neu">Vence ${fmtC(c.vence)}</span>`;
}
function rowCobro(c) {
  return `<div class="row"><div class="main"><div class="t">${esc(c.nombre)} ${pillCobro(c)}</div>
    <div class="s">${esc(c.det)}${c.vence ? ' · ' + fmtF(c.vence) : ''}${c.mora > 0 ? ' · mora estimada ' + money(c.mora) : ''}</div></div>
    <div class="amt">${money(c.monto)}</div>
    <div class="acts">${wa(c.nombre, c.tel, msgCobro(c))}<button class="btn sm pri" data-act="cobrar" data-kind="${c.kind}" data-id="${c.id}">Cobrar</button>${c.kind === 'venta' && c.cid ? `<button class="btn sm" data-act="financiar" data-id="${c.id}">Financiar</button>` : ''}</div></div>`;
}

function masVendidos() {
  const desde = sumaDias(hoy(), -30), m = {};
  S.ventas.filter(v => v.fecha >= desde).forEach(v => v.items.forEach(i => { m[i.nombre] = (m[i.nombre] || 0) + i.cant; }));
  return Object.entries(m).map(([nombre, cant]) => ({nombre, cant})).sort((a, b) => b.cant - a.cant).slice(0, 5);
}
function alertas(cobros) {
  const a = [];
  cobros.filter(c => c.dias > 0).sort((x, y) => y.dias - x.dias).forEach(c => a.push({cls: 'bad', tag: 'Atrasado', t: `${c.nombre} debe ${money(c.monto)}`, s: `${c.dias} ${c.dias === 1 ? 'día' : 'días'} de atraso`}));
  cobros.filter(c => c.vence && c.dias === 0 && diffDias(c.vence, hoy()) <= 3).forEach(c => { const f = diffDias(c.vence, hoy());
    a.push({cls: 'warn', tag: f === 0 ? 'Hoy' : 'Pronto', t: `${c.nombre} paga ${money(c.monto)}`, s: f === 0 ? 'Vence hoy' : `Vence en ${f} ${f === 1 ? 'día' : 'días'}`}); });
  S.productos.filter(stockBajo).forEach(p => a.push({cls: 'warn', tag: 'Stock', t: `${p.nombre}: quedan ${p.stock}`, s: `Mínimo ${p.minimo || 0}. Conviene reponer.`}));
  return a;
}

function vCobros(cobros) {
  const f = UI.filtro;
  const L = cobros.filter(c => f === 'todos' ? true : f === 'atrasados' ? c.dias > 0 : f === 'hoy' ? c.vence === hoy() : (c.vence && c.dias === 0 && diffDias(c.vence, hoy()) >= 0 && diffDias(c.vence, hoy()) <= 7));
  const tot = L.reduce((a, c) => a + c.monto, 0);
  const rec = [...S.pagos].sort((a, b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : (a.creado < b.creado ? 1 : -1)).slice(0, 8);
  const chip = (k, t) => `<button data-act="filtro" data-k="${k}" aria-pressed="${f === k}">${t}</button>`;

function vPrestamos() {

  const L = S.prestamos.filter(p => coincide(nombreCli(p.clienteId))).map(p => ({p, d: detalle(p)}))

  const activos = S.prestamos.map(p => detalle(p)).filter(d => !d.saldado);

  const interesPend = activos.reduce((a, d) => a + d.interes, 0);
  const chip = (k, t) => `<button data-act="filtro" data-k="${k}" aria-pressed="${f === k}">${t}</button>`;

    return `<div class="row click" data-act="ver-prestamo" data-id="${p.id}"><div class="main"><div class="t">${esc(nombreCli(p.clienteId))} <span class="pill ${e.cls}">${e.txt}</span></div>

/* En el navegador abre la ventana de impresión; en el APK (que no puede imprimir) comparte el documento como archivo .html para abrirlo e imprimir/guardar PDF desde otra app */
function abrirImpresion(html, nombre) {
  if (NATIVO()) {
    const limpio = html.replace(/<script>window\.onload[^<]*<\/script>/, '');
    guardarNativo(new Blob([limpio], {type: 'text/html'}), nombre.replace(/[^a-z0-9áéíóúñ]+/gi, '-').toLowerCase() + '-' + hoy() + '.html');
    return;
  }
  const w = window.open('', '_blank');
  if (w) { w.document.write(html); w.document.close(); }
}
function imprimirVista() {
  if (!NATIVO()) { window.print(); return; }
  const estilos = [...document.querySelectorAll('style')].map(x => x.outerHTML).join('');
  const html = '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reporte</title>' + estilos + '</head><body>' + document.querySelector('#view').outerHTML + '</body></html>';
  abrirImpresion(html, 'reporte');
}

function verPrestamo(id) {
  const p = S.prestamos.find(x => x.id === id); if (!p) return;
  const d = detalle(p), cli = cliente(p.clienteId) || {}, e = estadoPrestamo(p);

/* ===== Pantallas: Ventas, Gastos e Inventario ===== */
function vVentas() {
  const mes = hoy().slice(0, 7);
  const vm = S.ventas.filter(v => v.fecha.startsWith(mes)), gm = S.gastos.filter(g => g.fecha.startsWith(mes));
  const totV = vm.reduce((a, v) => a + v.total, 0), totG = gm.reduce((a, g) => a + g.monto, 0);
  const margen = vm.reduce((a, v) => a + v.items.reduce((b, i) => b + (i.precio - (i.costo || 0)) * i.cant, 0), 0);
  const gOper = gm.filter(g => g.cat !== 'Compra de mercancía').reduce((a, g) => a + g.monto, 0);   /* las compras ya están en el costo de lo vendido */
  const seg = `<div class="seg"><button data-act="vg" data-k="ventas" aria-pressed="${UI.vg === 'ventas'}">Ventas</button><button data-act="vg" data-k="gastos" aria-pressed="${UI.vg === 'gastos'}">Gastos</button></div>`;
  const kp = `<div class="grid kpis" style="margin-bottom:14px">
    <div class="kpi"><div class="l">Vendido este mes</div><div class="v">${money(totV)}</div></div>
    <div class="kpi"><div class="l">Gastos este mes</div><div class="v">${money(totG)}</div></div>
    <div class="kpi ${margen - gOper >= 0 ? 'ok' : 'bad'}"><div class="l">Ganancia estimada</div><div class="v">${money(margen - gOper)}</div></div></div>`;
  if (UI.vg === 'gastos') {
    const L = S.gastos.filter(g => coincide(g.concepto + ' ' + (g.cat || ''))).sort((a, b) => a.fecha < b.fecha ? 1 : -1);
    return kp + `<div class="tools">${buscaBox('Buscar gasto')}${seg}<button class="btn pri" data-act="nuevo-gasto">Nuevo gasto</button></div>
    <div class="panel">${L.length ? L.map(g => `<div class="row"><div class="main"><div class="t">${esc(g.concepto)}</div><div class="s">${fmtF(g.fecha)}${g.cat ? ' · ' + esc(g.cat) : ''}</div></div><div class="amt">${money(g.monto)}</div><button class="btn sm danger" data-act="del-gasto" data-id="${g.id}">Quitar</button></div>`).join('')
      : vacio('Sin gastos registrados', 'Anota alquiler, transporte, compras y otros gastos para saber tu ganancia real.')}</div>`;
  }
  const L = S.ventas.filter(v => coincide(nombreCli(v.clienteId) + ' ' + v.items.map(i => i.nombre).join(' '))).sort((a, b) => a.fecha < b.fecha ? 1 : a.fecha > b.fecha ? -1 : (a.creado < b.creado ? 1 : -1));
  return kp + `<div class="tools">${buscaBox('Buscar venta o cliente')}${seg}<button class="btn pri" data-act="nueva-venta">Nueva venta</button></div>
  <div class="panel">${L.length ? L.slice(0, 80).map(v => { const s = ventaSaldo(v);
    return `<div class="row"><div class="main"><div class="t">${esc(nombreCli(v.clienteId))} ${s > 0 ? `<span class="pill ${v.vence && diffDias(hoy(), v.vence) > 0 ? 'bad' : 'warn'}">Debe ${money(s)}</span>` : '<span class="pill ok">Pagada</span>'}</div>
      <div class="s">${fmtF(v.fecha)} · ${v.items.map(i => i.cant + ' ' + esc(i.nombre)).join(', ')}</div></div>
      <div class="amt">${money(v.total)}</div>
      <div class="acts">${s > 0 ? `<button class="btn sm pri" data-act="cobrar" data-kind="venta" data-id="${v.id}">Cobrar</button>` : ''}${s > 0 && v.clienteId ? `<button class="btn sm" data-act="financiar" data-id="${v.id}">Financiar</button>` : ''}<button class="btn sm" data-act="recibo-venta" data-id="${v.id}">Recibo</button><button class="btn sm danger" data-act="del-venta" data-id="${v.id}">Anular</button></div></div>`; }).join('')
    : vacio('Aún no hay ventas', 'Registra una venta y el inventario baja solo. Si el cliente no paga todo, queda como crédito.')}</div>`;

      <div class="amt">${p.stock} ${esc(p.unidad || 'uds')}<div class="small muted">mínimo ${p.minimo || 0}</div></div>
      <button class="btn sm" data-act="entrada" data-id="${p.id}">Reponer</button></div>`; }).join('')
    : vacio(S.productos.length ? 'Sin resultados' : 'Aún no hay mercancía', 'Agrega tus productos con costo, precio y cantidad. Recibirás un aviso cuando queden pocos.')}</div>`;

}
async function savePrestamo() {

  const nuevo = {...p, id: uid(), clienteId: v$('cli'), tipoNombre: tp ? tp.nombre : '', condiciones: v$('cond'), nota: v$('nota'), creado: Date.now()};

  cerrar(); UI.tab = 'prestamos'; pintar(); aviso('Préstamo creado'); reciboPrestamo(nuevo.id);
}

/* ----- Cobro ----- */
/* Sugerencia y tope de un pago según a qué se aplica: cuota (saldo del préstamo) o mora */
function cobroInfo(kind, id, concepto) {
  if (kind === 'prestamo') {
    const p = S.prestamos.find(x => x.id === id), d = detalle(p);
    if (concepto === 'mora') return {saldo: d.moraPend, sug: d.moraPend, cli: p.clienteId, tit: 'Mora por atraso', tipo: 'mora'};
    return {saldo: d.saldo, sug: d.vencido > 0 ? d.vencido : d.proxima ? d.proxima.falta : d.saldo, cli: p.clienteId, tit: `Cuota ${d.proxima ? d.proxima.n : ''} de ${p.cuotas}`, tipo: 'prestamo'};
  }
  const v = S.ventas.find(x => x.id === id), s = ventaSaldo(v);
  return {saldo: s, sug: s, cli: v.clienteId, tit: 'Venta a crédito', tipo: 'venta'};
}
function formCobro(kind, id) {
  let concepto = 'cuota', conMora = false;
  if (kind === 'prestamo') { const d = detalle(S.prestamos.find(x => x.id === id)); conMora = d.moraPend > 0; if (d.saldado) concepto = 'mora'; }
  const r = cobroInfo(kind, id, concepto);
  const optConcepto = kind === 'prestamo' && conMora && concepto === 'cuota' ? sel('concepto', 'Este pago es de', [['cuota', 'Cuotas del préstamo'], ['mora', 'Mora por atraso']], 'cuota', 'full') : `<input type="hidden" id="f-concepto" value="${concepto}">`;
  abrir(`<h2>Registrar pago</h2><p style="margin:0 0 12px"><b>${esc(nombreCli(r.cli))}</b><br><span class="muted small" id="cobro-tit">${r.tit} · pendiente ${money(r.saldo)}</span></p><div class="f" data-live="cobro" data-kind="${kind}" data-id="${id}">
    ${optConcepto}${fld('monto', 'Monto recibido (RD$)', String(Math.round(r.sug * 100) / 100), 'number')}${fld('fecha', 'Fecha', hoy(), 'date')}${fld('nota', 'Nota (efectivo, transferencia…)', '', 'text', '', 'full')}</div>
    <div class="foot"><button class="btn" data-act="cerrar">Cancelar</button><button class="btn pri" data-act="save-cobro" data-kind="${kind}" data-id="${id}">Guardar pago</button></div>`);
}
async function saveCobro(kind, id) {
  const r = cobroInfo(kind, id, v$('concepto') || 'cuota'), m = num(v$('monto'));
  if (m <= 0) return aviso('Escribe el monto recibido.');
  if (m > r.saldo + 0.005) return aviso('El pago es mayor que lo que debe (' + money(r.saldo) + ').');
  const pago = {id: uid(), tipo: r.tipo, refId: id, clienteId: r.cli, monto: m, fecha: v$('fecha') || hoy(), nota: v$('nota'), creado: Date.now()};
  await guardar('pagos', pago);
  cerrar(); aviso('Pago registrado'); reciboPago(pago.id);
}

async function saveVenta() {

  for (const pid in porProd) { const p = producto(pid); if (porProd[pid] > p.stock) return aviso(`Solo quedan ${p.stock} de ${p.nombre}.`); }
  if (items.some(i => i.precio < 0)) return aviso('El precio no puede ser negativo.');
  const c = v$('cobrado'), pag = c === '' ? total : num(c);
  if (pag < 0) return aviso('Lo cobrado no puede ser negativo.');
  if (pag > total + 0.005) return aviso('Lo cobrado es mayor que el total.');
  const cli = v$('cli');
  if (pag < total - 0.005 && !cli) return aviso('Para vender a crédito elige un cliente.');
  const financiar = pag < total - 0.005 && v$('resto') === 'financiar';
  const fecha = v$('fecha') || hoy();
  const venta = {id: uid(), fecha, clienteId: cli, items, total, pagado0: pag, vence: pag < total - 0.005 ? (v$('vence') || sumaDias(fecha, 15)) : '', creado: Date.now()};

/* ----- Ajustes del negocio (salen en los recibos) ----- */
/* ----- PIN de acceso: se guarda solo un resumen (hash), nunca el PIN ----- */
const PINK = 'mnad-pin', PINF = 'mnad-pin-f';
const pinGet = () => { try { return JSON.parse(localStorage.getItem(PINK) || 'null'); } catch (e) { return null; } };
async function hashPin(pin, salt) {
  const txt = salt + ':' + pin;
  try { if (window.crypto && crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } } catch (e) {}
  let h = 2166136261; for (let i = 0; i < txt.length; i++) { h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619); } return 'f' + (h >>> 0).toString(16);
}
let lockBuf = '', bgAt = 0;
const fallos = () => { try { return JSON.parse(localStorage.getItem(PINF) || '{}') || {}; } catch (e) { return {}; } };
function lockPintar(msg) {
  const pn = pinGet(); $('#lock-dots').innerHTML = Array.from({length: pn ? pn.len : 4}, (_, i) => `<i class="${i < lockBuf.length ? 'on' : ''}"></i>`).join('');
  if (msg !== undefined) $('#lock-msg').textContent = msg;
}
function bloquear() { if (!pinGet()) return; lockBuf = ''; $('#lock').hidden = false; lockPintar('Escribe tu PIN'); document.body.classList.remove('rec'); $('#modal').innerHTML = ''; }
async function lockProbar() {
  const pn = pinGet(); if (!pn || !lockBuf) return;
  const f = fallos(), ahora = Date.now();
  if (f.hasta && ahora < f.hasta) { lockBuf = ''; return lockPintar(`Demasiados intentos. Espera ${Math.ceil((f.hasta - ahora) / 1000)} s.`); }
  if (await hashPin(lockBuf, pn.salt) === pn.hash) { try { localStorage.removeItem(PINF); } catch (e) {} lockBuf = ''; $('#lock').hidden = true; return; }
  const n = (f.n || 0) + 1, extra = Math.floor(n / 5), nuevo = {n};
  if (n % 5 === 0) nuevo.hasta = ahora + Math.min(600, 30 * Math.pow(2, extra - 1)) * 1000;
  try { localStorage.setItem(PINF, JSON.stringify(nuevo)); } catch (e) {}
  lockBuf = ''; lockPintar(nuevo.hasta ? 'Demasiados intentos. Espera un momento.' : 'PIN incorrecto');
}
function formPin(modo) {
  const pn = pinGet(), nuevo = modo !== 'quitar';
  abrir(`<h2>${modo === 'quitar' ? 'Quitar el PIN' : modo === 'cambiar' ? 'Cambiar el PIN' : 'Activar PIN'}</h2>
    ${modo === 'activar' ? `<p class="small muted" style="margin:0 0 10px">El PIN protege la app: se pide al abrirla y cuando vuelves a ella después de un minuto. <b>Si lo olvidas</b> no hay forma de recuperarlo: tendrías que borrar los datos de la app y restaurar tu respaldo. Por eso conviene tener un respaldo reciente.</p>` : ''}
    <div class="f">${pn ? fld('pin0', 'PIN actual', '', 'password', 'inputmode="numeric" maxlength="6" autocomplete="off"', 'full') : ''}
    ${nuevo ? fld('pin1', 'PIN nuevo (4 a 6 números)', '', 'password', 'inputmode="numeric" maxlength="6" autocomplete="off"', 'full') + fld('pin2', 'Repite el PIN nuevo', '', 'password', 'inputmode="numeric" maxlength="6" autocomplete="off"', 'full') : ''}</div>
    <div class="foot"><button class="btn" data-act="cerrar">Cancelar</button><button class="btn pri" data-act="save-pin" data-modo="${modo}">${modo === 'quitar' ? 'Quitar PIN' : 'Guardar PIN'}</button></div>`);
}
async function savePin(modo) {
  const pn = pinGet();
  if (pn && await hashPin(v$('pin0'), pn.salt) !== pn.hash) return aviso('El PIN actual no es correcto.');
  if (modo === 'quitar') { try { localStorage.removeItem(PINK); localStorage.removeItem(PINF); } catch (e) {} cerrar(); return aviso('PIN quitado'); }
  const a = v$('pin1'), b = v$('pin2');
  if (!/^\d{4,6}$/.test(a)) return aviso('El PIN debe tener de 4 a 6 números.');
  if (a !== b) return aviso('Los dos PIN no son iguales.');
  const salt = uid(); 
  try { localStorage.setItem(PINK, JSON.stringify({salt, hash: await hashPin(a, salt), len: a.length})); localStorage.removeItem(PINF); } catch (e) { return aviso('No se pudo guardar el PIN.'); }
  cerrar(); aviso('PIN guardado. Se pedirá al abrir la app.');
}
function iniciarBloqueo() {
  $('#lock').addEventListener('click', e => {
    const b = e.target.closest('[data-k]'); if (!b) return; const k = b.dataset.k, pn = pinGet(); if (!pn) return;
    if (k === 'del') lockBuf = lockBuf.slice(0, -1); else if (k === 'ok') { lockProbar(); return; } else if (lockBuf.length < pn.len) lockBuf += k;
    lockPintar(''); if (lockBuf.length === pn.len) lockProbar();
  });
  $('#lock-forgot').addEventListener('click', () => confirmar('¿Olvidaste tu PIN?', 'La única forma es borrar todos los datos de la app y entrar de nuevo vacía. Después puedes restaurar tu respaldo (.json). Si no tienes respaldo, esos datos se pierden.', 'Borrar todo y entrar', () => {
    try { localStorage.clear(); } catch (e) {} location.reload(); }));
  const fuera = () => { bgAt = Date.now(); }, dentro = () => { if (pinGet() && bgAt && Date.now() - bgAt > 60000) bloquear(); bgAt = 0; };
  document.addEventListener('visibilitychange', () => document.hidden ? fuera() : dentro());

  bloquear();
}

async function restaurar(file) {
  let j;
  try {
    j = JSON.parse(await file.text());
  } catch (e) {
    return aviso('Archivo JSON malformado. No se restauró.');
  }

  if (!j || typeof j !== 'object') {
    return aviso('Archivo inválido. Debe ser un respaldo JSON de Mi Negocio Al Día.');
  }
  if (j.app !== 'mi-negocio-al-dia') {
    return aviso('Archivo de otra aplicación. No se restauró.');
  }
  if (j.version !== 1) {
    return aviso('Versión de respaldo incompatible. Solo se aceptan respaldos versión 1. No se restauró.');
  }
  if (!j.datos || typeof j.datos !== 'object' || Array.isArray(j.datos)) {
    return aviso('Estructura inválida: falta el objeto "datos". No se restauró.');
  }

  // Validar colecciones
  for (let i = 0; i < COLS.length; i++) {
    const c = COLS[i];
    if (j.datos.hasOwnProperty(c)) {
      if (!Array.isArray(j.datos[c])) {
        return aviso(`Estructura inválida: la colección "${c}" debe ser un arreglo. No se restauró.`);
      }
    }
  }

  // Validar registros y contar agregar/sobrescribir
  let agregar = 0;
  let sobrescribir = 0;
  const aValidar = [];
  for (let ci = 0; ci < COLS.length; ci++) {
    const c = COLS[ci];
    const arr = Array.isArray(j.datos[c]) ? j.datos[c] : [];
    for (let ri = 0; ri < arr.length; ri++) {
      const o = arr[ri];
      if (!o || typeof o !== 'object') {
        return aviso('Hay un registro inválido en el archivo (no es un objeto). No se restauró.');
      }
      if (!o.id || typeof o.id !== 'string' || o.id.trim() === '') {
        return aviso('Hay un registro sin identificador (id). No se restauró por seguridad.');
      }
      aValidar.push({c, o});
      const existe = Array.isArray(S[c]) && S[c].some(x => x && x.id === o.id);
      if (existe) sobrescribir++; else agregar++;
    }
  }

  const total = agregar + sobrescribir;
  if (total === 0) {
    return aviso('El respaldo no contiene registros para restaurar.');
  }

  // Ofrecer respaldo actual antes de confirmar
  respaldoActualAntesRestaurar();
  const fechaRespaldo = j.fecha || 'desconocida';
  const msg = `Respaldo del ${fechaRespaldo}\n\nSe agregarán: ${agregar}\nSe sobrescribirán: ${sobrescribir}\nTotal: ${total}\n\nLos registros existentes que NO estén en este archivo NO se borrarán.\n\n¿Continuar con la restauración?`;
  if (!confirm(msg)) {
    return aviso('Restauración cancelada.');
  }

  if (DB) {
    try {
      for (let i = 0; i < aValidar.length; i++) {
        const it = aValidar[i];
        await guardar(it.c, it.o);
      }
      cerrar();
      aviso(`Restauración completada (modo nube). Agregados: ${agregar}, actualizados: ${sobrescribir}.`);
    } catch (e) {
      cerrar();
      aviso('Ocurrió un error durante la restauración en modo nube. Algunos registros pueden haberse guardado antes del error. No se puede garantizar reversión automática en este modo.');
    }
    return;
  }

  // Modo local con snapshot y aplicación atómica
  const snapshot = copiaProfundaS();
  try {
    const nuevoS = copiaProfundaS();
    for (let i = 0; i < aValidar.length; i++) {
      const it = aValidar[i];
      const c = it.c;
      const o = it.o;
      if (!Array.isArray(nuevoS[c])) nuevoS[c] = [];
      const idx = nuevoS[c].findIndex(x => x && x.id === o.id);
      if (idx >= 0) {
        nuevoS[c][idx] = o;
      } else {
        nuevoS[c].push(o);
      }
    }
    // Aplicar solo si todo OK
    COLS.forEach(c => { S[c] = Array.isArray(nuevoS[c]) ? nuevoS[c] : (Array.isArray(S[c]) ? S[c] : []); });
    lsSave();
    pintar();
    cerrar();
    aviso(`Restauración completada. Agregados: ${agregar}, actualizados: ${sobrescribir}.`);
  } catch (e) {
    // Revertir en memoria
    try {
      COLS.forEach(c => { S[c] = Array.isArray(snapshot[c]) ? snapshot[c].map(x => ({...x})) : []; });
      pintar();
    } catch (e2) {}
    aviso('Error durante la restauración. Se revirtió el estado en memoria al momento anterior. Verifica los datos.');
  }
}

  'rec-copiar': async () => { try { await navigator.clipboard.writeText(RECIBO.txt); aviso('Recibo copiado'); } catch (e) { if (NATIVO()) { try { await CAPN.Plugins.Share.share({text: RECIBO.txt, dialogTitle: 'Compartir recibo'}); return; } catch (e2) {} } aviso('No se pudo copiar.'); } },
  'rec-imagen': () => generarImagenRecibo(),
  'nueva-venta': () => formVenta(), 'save-venta': () => saveVenta(),
  'mas-linea': () => { $('#lineas').insertAdjacentHTML('beforeend', lineaVenta()); },
  'quitar-linea': el => { const l = $('#lineas'); if (l.children.length > 1) { el.closest('.vl').remove(); previewVenta(); } },
  'nuevo-gasto': () => formGasto(), 'save-gasto': () => saveGasto(),
  'nuevo-producto': () => formProducto(), 'edit-producto': el => formProducto(el.dataset.id), 'save-producto': el => saveProducto(el.dataset.id),
  entrada: el => formEntrada(el.dataset.id), 'save-entrada': () => saveEntrada(),
  'del-prestamo': async el => { const p0 = S.prestamos.find(x => x.id === el.dataset.id); for (const x of S.pagos.filter(x => (x.tipo === 'prestamo' || x.tipo === 'mora') && x.refId === el.dataset.id)) await borrar('pagos', x.id); await borrar('prestamos', el.dataset.id); const v0 = p0 && p0.ventaId && S.ventas.find(x => x.id === p0.ventaId); if (v0) await guardar('ventas', {...v0, financiado: 0, prestamoId: ''}); cerrar(); aviso(v0 ? 'Préstamo eliminado. La venta volvió a quedar a crédito.' : 'Préstamo eliminado'); },
  'del-cliente': async el => { const id = el.dataset.id;
    if (S.prestamos.some(p => p.clienteId === id) || S.ventas.some(v => v.clienteId === id)) return aviso('Este cliente tiene préstamos o ventas. Elimínalos primero.');
    await borrar('clientes', id); cerrar(); aviso('Cliente eliminado'); },
  'del-pago': el => borrar('pagos', el.dataset.id).then(() => aviso('Pago anulado')),
  'del-gasto': el => borrar('gastos', el.dataset.id),
  'del-venta': el => anularVenta(el.dataset.id),
  'del-producto': async el => { await borrar('productos', el.dataset.id); cerrar(); aviso('Producto eliminado'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'fondo' && e.target !== el) return;
  if (el.dataset.act.startsWith('del-') && !el.dataset.armed) {          /* confirmar con un segundo toque */
    el.dataset.armed = '1'; const t = el.textContent; el.textContent = '¿Seguro? Toca otra vez';
    setTimeout(() => { el.textContent = t; delete el.dataset.armed; }, 3500); return;
  }
  const f = ACT[el.dataset.act]; if (f) f(el);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { UI.q = e.target.value; pintar(); return; }
  const live = e.target.closest('[data-live]'); if (!live) return;
  if (live.dataset.live === 'prestamo') previewPrestamo(); else if (live.dataset.live === 'venta') previewVenta();
});
const setV = (id, v) => { const e = document.getElementById('f-' + id); if (e) e.value = v; };
document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'r-d' || id === 'r-h') { if (e.target.value) { if (id === 'r-d') UI.desde = e.target.value; else UI.hasta = e.target.value; pintar(); } return; }
  if (id === 'f-restore') { if (e.target.files[0]) restaurar(e.target.files[0]); return; }
  if (id === 'f-tipo') { const t = S.tipos.find(x => x.id === e.target.value); if (t) { setV('tasa', t.tasa); setV('base', t.base); setV('cuotas', t.cuotas); setV('freq', t.freq); setV('mora', t.mora || 0); setV('cond', t.cond || ''); } previewPrestamo(); return; }
  if (id === 'f-concepto') { const live = e.target.closest('[data-live]'); if (live) { const r = cobroInfo(live.dataset.kind, live.dataset.id, e.target.value); setV('monto', Math.round(r.sug * 100) / 100); const t = $('#cobro-tit'); if (t) t.textContent = `${r.tit} · pendiente ${money(r.saldo)}`; } return; }
  if (e.target.classList.contains('vp')) { const p = producto(e.target.value), l = e.target.closest('.vl'), r = l.querySelector('.vpr'); r.placeholder = p ? p.precio : ''; r.value = ''; l.querySelector('.vg').value = p ? (p.garantia || cfg().garantia || '') : ''; }
  const live = e.target.closest('[data-live]'); if (live && live.dataset.live === 'venta') previewVenta();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').firstChild) cerrar(); });

/* ----- arranque: primero la base compartida; si no existe, este navegador ----- */
function marcaSync(nube) {
  $('#dot').className = 'dot' + (nube ? '' : ' off');
  $('#syncTxt').textContent = nube ? 'Guardado en la nube' : (ES_APP ? 'Guardando solo en este teléfono' : 'Guardando solo en este navegador');
}
async function arrancar() {
  $('#view').innerHTML = '<div class="panel"><div class="empty">Cargando tus datos…</div></div>';
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) db = await crearLocalDB();
  if (!db) { lsLoad(); copiaDelDia(); marcaSync(false); pintar(); return; }
  DB = db; marcaSync(!db.local);
  const listos = new Set(); let pintado = false;
  const mostrar = () => { pintado = true; pintar(); };
  setTimeout(() => { if (!pintado) mostrar(); }, 4000);
  COLS.forEach(c => db.collection(c).onSnapshot(snap => {
    S[c] = snap.docs.map(d => d.data());
    listos.add(c);
    if (listos.size === COLS.length || pintado) mostrar();
  }, err => { if (err && err.code === 'revoked') { DB = null; marcaSync(false); } }));
}
pintar = (orig => function () { try { orig(); } catch (e) { console.error(e); } })(pintar);
iniciarBloqueo();
if (ES_APP) document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[target="_blank"]'); if (a && a.href) { e.preventDefault(); location.href = a.href; } }, true);
arrancar();
/* Sin internet: guarda la app en el equipo y pide que el navegador no borre los datos */
if (!ES_APP && 'serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
