name: Android release

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'www/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-release.yml'

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular número de versión
        run: echo "BUILD=$(( $(git rev-list --count HEAD) + 1000 ))" >> "$GITHUB_ENV"

      - name: Escribir la versión en la app
        run: sed -i "s/__BUILD__/$BUILD/g" index.html sw.js

      - name: Copiar la web a www (fuente única)
        run: cp index.html www/index.html && cp sw.js www/sw.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          APP_BUILD=$BUILD ./gradlew assembleDebug --console=plain

      - name: Nombrar el APK con la versión
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "MiNegocioAlDia-${BUILD}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ env.BUILD }}
          name: Mi Negocio Al Día ${{ env.BUILD }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            MiNegocioAlDia-${{ env.BUILD }}.apk
