name: Publicar web (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Tomar el código
        uses: actions/checkout@v4

      - name: Subir la carpeta www
        uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
